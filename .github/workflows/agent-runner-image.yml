name: Agent Runner Image

# Builds and publishes the code-mode / embedded-execution sandbox image to GHCR.
# Uses the built-in GITHUB_TOKEN (packages: write) — no external registry secrets.
# The Docker execution adapter pulls ghcr.io/aryaminus/controlkeel-agent-runner:latest.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.agent-runner"
      - ".github/workflows/agent-runner-image.yml"
  workflow_dispatch:

concurrency:
  group: agent-runner-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent-runner
          push: true
          tags: |
            ghcr.io/aryaminus/controlkeel-agent-runner:latest
            ghcr.io/aryaminus/controlkeel-agent-runner:${{ github.sha }}
