# Local ControlKeel compose file
#
# ControlKeel runs with local SQLite storage by default. The app stores
# runtime data under /data, backed by the controlkeel-data volume below.
#
# For cloud-mode deployments that use Postgres, set CONTROLKEEL_RUNTIME_MODE=cloud
# and provide DATABASE_URL via your deployment environment instead of using this
# local-first compose file as-is.
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      PHX_HOST: ${PHX_HOST:-localhost}
      DATABASE_PATH: ${DATABASE_PATH:-/data/controlkeel.db}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev-only-compose-secret-key-base-change-me}
    volumes:
      - controlkeel-data:/data
    restart: unless-stopped
volumes:
  controlkeel-data:
