# fly.toml — ControlKeel deployment manifest
#
# This file deploys the canonical SaaS instance at https://controlkeel.com.
# Self-hosters: copy this file to your own project, change `app`, `primary_region`,
# and the `PHX_HOST` env (or follow `docs/self-hosting.md` for a guided walkthrough
# via the [deploy/fly.self-host.toml](deploy/fly.self-host.toml) template).
#
# Same release artifact runs in both deployments — only env vars differ.
#
# Bring-up (canonical SaaS):
#   fly launch --no-deploy --copy-config --name controlkeel
#   fly postgres create --name controlkeel-db && fly postgres attach controlkeel-db
#   fly secrets set \
#     SECRET_KEY_BASE="$(mix phx.gen.secret)" \
#     AUDIT_EXPORT_SIGNING_KEY="$(openssl rand -hex 32)"
#   fly certs create controlkeel.com
#   fly deploy
#
# Smoke test:
#   curl -sS https://controlkeel.com/  # 200 home page
#   controlkeel cloud connect --enroll https://controlkeel.com
#   controlkeel telemetry enable --level health
#   controlkeel telemetry flush

app = "controlkeel"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/controlkeel eval \"ControlKeel.Release.migrate()\""
  strategy = "rolling"

[env]
  CONTROLKEEL_RUNTIME_MODE = "cloud"
  CONTROLKEEL_BUS = "local"
  PHX_SERVER = "true"
  PHX_HOST = "controlkeel.com"
  PORT = "8080"
  POOL_SIZE = "10"
  ECTO_USE_SSL = "true"
  LOGGER_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
